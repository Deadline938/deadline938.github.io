<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital@0;1&display=swap" rel="stylesheet">
  <title>Shy Dummy</title>
  <style>
        @property --item-color {
            syntax: '<color>';
            inherits: true;
            initial-value: #cccccc;
        }

        html {
            scrollbar-gutter: stable both-edges;
        }

        body {
            font-family: 'Source Code Pro', sans-serif;
            font-size: 0.9rem;
            background-color: #070707;
            color: rgb(212, 212, 212);
            margin-top: 100px;
            padding-bottom: 15px;
        }

        .flex-container {
            display: flex;
            justify-content: center;
        }

        .flex-card {
            background-color: #070707;
            color: #FFF;
            border-radius: 10px;
            padding-left: 20px;
            border: 3px solid red;
            width: 85%;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.63), #070707),
                    url('/location_placeholder.png');
            background-repeat: no-repeat; 
            background-size: auto; 
            background-attachment: fixed; 
            text-align: left;
        }

        .grid-container {
            display: flex;
            justify-content: center;
        }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 85%;
        }

        .grid-item {
            --location-color: #cccccc;
            --resident-color: #cccccc;
            --item-color: var(--location-color);

            text-decoration: none;
            flex: 1 1 400px;
            display: flex;
            align-items: flex-start;
            background-color: #070707;
            color: #FFF;
            border-radius: 6px;
            padding-right: 20px;
            padding-bottom: 5px;
            text-align: left;
            border: 2px solid transparent;
            box-sizing: border-box;
            transition: box-shadow 0.25s ease-out, transform 0.2s ease-out, --item-color 0.25s ease-out;
            cursor: pointer;
            background: 
                linear-gradient(#070707, color-mix(in srgb, var(--item-color) 10%, black)) padding-box, 
                linear-gradient(var(--item-color), color-mix(in srgb, var(--item-color) 60%, black)) border-box;
        }

        .grid-item:hover {
            box-shadow: 0px 0px 25px 7px color-mix(in srgb, var(--item-color) 10%, transparent),
            0px 0px 100px 50px color-mix(in srgb, var(--item-color) 5%, transparent);
            transform: translateY(-10px);
            --item-color: var(--resident-color);
        }

        .grid-item:hover .resident-role {
            color: var(--resident-color);
        }

        .resident-name {
            font-size: 1.4em;
            margin-bottom: -8px;
        }

        .resident-role {
            font-size: 0.8em;
            margin-bottom: -5px;
            color: var(--location-color);
            transition: color 0.25s ease-out;
        }

        .resident-icon {
            max-height: 100px;
            display: block;
            float: left; 
            margin: 10px;
        }

        .topbar {
            background: transparent;
            height: 150px;
            font-size: 1.2em;
            position: fixed;
            top: 0;
            gap: 16px;
            display: flex;
            width: 100%;
            padding-top: 10px;
            pointer-events: none;
            z-index: 3;
        }

        .topbar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(#070707, #07070700);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .topbar.scrolled .topbar-bg {
            opacity: 1;
        }

        .topbar-logo {
            margin: 12px 0 10px 20px;
            max-height: 22px;
        }

        .topbar-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
        }

        .topbar-nav a {
            text-decoration: none;
            color: rgb(175, 175, 175);
            margin-top: 10px;
            pointer-events: all;
            transition: color 0.2s ease-in-out;
        }

        .topbar-nav a:hover {
            color: rgb(255, 255, 255);
        }

        #page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 1;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #page-transition-overlay.fade-out {
            opacity: 0;
        }

        @media screen and (max-width: 1001px) {
            .topbar {
                flex-direction: column;
                align-items: center;
                padding: 1rem;
            }

            .topbar-logo {
                margin: 0 0 -15px 0;
            }

            .topbar-nav {
                position: relative;
                flex: none;                  
                width: 100%;
                justify-content: center;
                gap: 1.5rem;
            }
        }
  </style>
</head>
<body>
    <div id="page-transition-overlay"></div>
    


<div class="topbar" id="topbar">
    <div class="topbar-bg"></div>
    <img src="/logo-placeholder.png" class="topbar-logo">
    <div class="topbar-nav">
        <a href="residents_page.html">Story</a>
        <a href="residents_page.html">Gameplay</a>
        <a href="/universes/negativetale/residents_page.html">Residents</a>
        <a href="locations_page.html">Locations</a>
    </div>
</div>
    <main>
    <head>
    <link rel="stylesheet" href="/css/resident.css">
</head>

<div class="content-holder">
    <div class="text-content">
        <h2 style="--item-color: #3c4fd4">Shy Dummy</h2>
        <p style="font-size: 1rem; color: #3c4fd4; margin-top: -5px;">The Moon</p>
        <div class="separator" style="--item-color: #3c4fd4;"></div>
        <div style="--item-color: #3c4fd4;">
            <p></p>
        </div>

        

        

        

        

        
    </div>

    <div class="infobox">
        <div class="resident-element" style="--item-color: #3c4fd4">
            <div class="image-box">
                <div class="stat-holder">
                    <p class="stat-text">HP: </p>
                    <p class="stat-text">AT: </p>
                    <p class="stat-text">LV: </p>
                    <p class="stat-text">MG: </p>
                </div>
                <img src="/resident_placeholder.png" alt="Placeholder" style="max-height: 16rem;">
            </div>
            
            <table>
                <tr>
                    <th>Rarity</th>
                    <td></td>
                </tr>
                <tr>
                    <th>Type</th>
                    <td></td>
                </tr>
                <tr>
                    <th>Pronouns</th>
                    <td></td>
                </tr>
                <tr>
                    <th>Aliases</th>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>
</div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const topbar = document.getElementById('topbar');

            function onScroll() {
            if (window.scrollY > 1) { 
                topbar.classList.add('scrolled');
            } else {
                topbar.classList.remove('scrolled');
            }
            }

            window.addEventListener('scroll', onScroll);
            onScroll();
        });

        document.addEventListener('DOMContentLoaded', function () {
            const overlay = document.getElementById('page-transition-overlay');

            window.requestAnimationFrame(() => {
                overlay.classList.add('fade-out');
            });
        });
    </script>
</body>
</html>
