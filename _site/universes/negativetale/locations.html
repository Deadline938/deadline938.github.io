<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital@0;1&display=swap" rel="stylesheet">
  <title>NEGATIVETALE</title>
  <style>
        body {
            font-family: 'Source Code Pro', sans-serif;
            font-size: 0.9rem;
            background-color: #070707;
            color: rgb(212, 212, 212);
            margin-top: 100px;
            padding-bottom: 15px;
        }

        .flex-container {
            display: flex;
            justify-content: center;
        }

        .flex-card {
            background-color: #070707;
            color: #FFF;
            border-radius: 10px;
            padding-left: 20px;
            border: 3px solid red;
            width: 85%;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.63), #070707),
                    url('/location_placeholder.png');
            background-repeat: no-repeat; 
            background-size: auto; 
            background-attachment: fixed; 
            text-align: left;
        }

        .grid-container {
            display: flex;
            justify-content: center;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            width: 85%;
        }

        .grid-item {
            display: flex;
            align-items: flex-start;
            background-color: #070707;
            color: #FFF;
            border-radius: 6px;
            padding-right: 20px;
            height: 100%;
            text-align: left;
            border: 2px solid transparent;
            background: 
                linear-gradient(#070707, color-mix(in srgb, var(--border-color) 10%, black)) padding-box, 
                linear-gradient(var(--border-color), color-mix(in srgb, var(--border-color) 60%, black)) border-box;
        }

        .resident-name {
            font-size: 1.4em;
            margin-bottom: -8px;
        }

        .resident-role {
            font-size: 0.8em;
            margin-bottom: -5px;
            color: var(--border-color);
        }

        .resident-icon {
            max-height: 100px;
            display: block;
            float: left; 
            margin: 10px;
        }

        .topbar {
            background: transparent;
            height: 150px;
            font-size: 1.2em;
            position: fixed;
            top: 0;
            gap: 16px;
            display: flex;
            width: 100%;
            padding-top: 10px;
            pointer-events: none;
        }

        .topbar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(#070707, #07070700);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .topbar.scrolled .topbar-bg {
            opacity: 1;
        }

        .topbar-logo {
            margin: 12px 0 10px 20px;
            max-height: 22px;
        }

        .topbar-nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
        }

        .topbar-nav a {
            text-decoration: none;
            color: inherit;
            margin-top: 10px;
            pointer-events: all;
        }

        @media screen and (max-width: 1001px) {
            .topbar {
                flex-direction: column;
                align-items: center;
                padding: 1rem;
            }

            .topbar-logo {
                margin: 0 0 -15px 0;
            }

            .topbar-nav {
                position: relative;
                flex: none;                  
                width: 100%;
                justify-content: center;
                gap: 1.5rem;
            }
        }
  </style>
</head>
<body>
  <div class="topbar" id="topbar">
    <div class="topbar-bg"></div>
    <img src="/logo-placeholder.png" class="topbar-logo">
    <div class="topbar-nav">
        <a href="residents.html">Story</a>
        <a href="residents.html">Gameplay</a>
        <a href="residents.html">Residents</a>
        <a href="locations.html">Locations</a>
    </div>
</div>
  <main>
    <div class="flex-container">
    
        <div class="flex-card" style="border: 3px solid #a31f42;">
        <h2>Ruins</h2>
        <p>An ancient place.</p>
        </div>
    
</div>
  </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const topbar = document.getElementById('topbar');

            function onScroll() {
            if (window.scrollY > 1) { 
                topbar.classList.add('scrolled');
            } else {
                topbar.classList.remove('scrolled');
            }
            }

            window.addEventListener('scroll', onScroll);
            onScroll();
        });
    </script>
</body>
</html>
