---
layout: base
---
<div class="grid-container">
    <div class="grid">
        {% for item in page.grid_items %}
        <div class="grid-item" style="--border-color: {{ item.border_color }};">
            <img src="{{ item.image | relative_url }}" alt="Placeholder" class="resident-icon">
            <div class="resident-text">
                <p class="resident-name"><b>{{ item.title }}</b></p>
                <p class="resident-role">{{ item.role }}</p>
                <p class="resident-description">{{ item.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
